# Builds DrawingStudio-Setup-<version>.exe on GitHub's Windows machines.
# Runs on every push to main (or manually from the Actions tab) and publishes
# the installer as a GitHub Release, plus a downloadable artifact.
name: Build installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build app, bridges and installer
        shell: pwsh
        run: ./build-installer.ps1 -Version $env:APP_VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: DrawingStudio-Setup
          path: |
            dist/*.exe
            dist/*.zip

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Drawing Studio ${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.exe
            dist/*.zip
          body: |
            **DrawingStudio-Portable-*.zip** / **DrawingStudio.exe** - portable: no install, just run it. It adds itself to every Revit 2022-2027 on the PC.
            **DrawingStudio-Setup-*.exe** - installer for all Windows users (needs admin).
            In Revit, choose **Always Load** for Drawing Studio Bridge the first time.
